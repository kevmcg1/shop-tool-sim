<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Gearworks — 3D Gear Lab</title>
<meta name="description" content="Design 16 kinds of engineering gear in 3D, check whether they mesh, and export STL, OBJ or STEP." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="stage"></div>

<header>
  <div class="brand">GEAR<b>WORKS</b></div>
  <div class="spacer"></div>
  <button class="btn small ghost" id="presetBtn" title="Ready-made assemblies">presets</button>
  <button class="btn small ghost" id="fitBtn" title="Frame everything">fit view</button>
  <button class="btn small ghost" id="spinBtn">⏸ pause</button>
  <button class="btn small" id="exportBtn">export</button>
  <button class="btn small accent" id="addBtn">+ add gear</button>
</header>

<aside id="panel">
  <div id="grab"></div>
  <nav id="tabs">
    <button data-tab="gears">Gears <i id="countBadge">0</i></button>
    <button data-tab="edit">Edit</button>
    <button data-tab="mesh">Mesh</button>
    <button data-tab="scene">Scene</button>
  </nav>
  <div id="panelBody">
    <section id="tabGears"></section>
    <section id="tabEdit"></section>
    <section id="tabMesh"></section>
    <section id="tabScene"></section>
  </div>
</aside>

<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>
<input type="file" id="openFile" accept=".json,application/json" hidden />

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="vendor/three.min.js"><\/script>')</script>
<script src="js/util.js"></script>
<script src="js/profiles.js"></script>
<script src="js/geo.js"></script>
<script src="js/types.js"></script>
<script src="js/builders.js"></script>
<script src="js/calc.js"></script>
<script src="js/compat.js"></script>
<script src="js/mount.js"></script>
<script src="js/gears.js"></script>
<script src="js/scene.js"></script>
<script src="js/drives.js"></script>
<script src="js/brep.js"></script>
<script src="js/exporters.js"></script>
<script src="js/presets.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
